<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 학습 가이드 - 체크리스트</title>
    <meta name="description" content="AI 학습 과정을 체계적으로 관리하고 진행 상황을 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바: 왼쪽 체크리스트 -->
        <aside class="sidebar" id="checklist-sidebar">
            <div class="sidebar-header">
                <h2>학습 로드맵</h2>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                    <span class="progress-text" id="progress-text">0% 완료</span>
                </div>
            </div>
            
            <nav class="checklist-nav">
                <ul id="checklist-items">
                    <li class="checklist-item" data-id="1">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="check-1">
                            <span class="checkmark"></span>
                            <span class="item-text">AI 기본 개념 이해</span>
                        </label>
                    </li>
                    <li class="checklist-item" data-id="2">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="check-2">
                            <span class="checkmark"></span>
                            <span class="item-text">파이썬 기초 문법</span>
                        </label>
                    </li>
                    <li class="checklist-item" data-id="3">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="check-3">
                            <span class="checkmark"></span>
                            <span class="item-text">데이터 분석 입문 (Pandas)</span>
                        </label>
                    </li>
                    <li class="checklist-item" data-id="4">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="check-4">
                            <span class="checkmark"></span>
                            <span class="item-text">머신러닝 알고리즘 개요</span>
                        </label>
                    </li>
                    <li class="checklist-item" data-id="5">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="check-5">
                            <span class="checkmark"></span>
                            <span class="item-text">딥러닝 및 신경망 기초</span>
                        </label>
                    </li>
                    <li class="checklist-item" data-id="6">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="check-6">
                            <span class="checkmark"></span>
                            <span class="item-text">LLM 및 프롬프트 엔지니어링</span>
                        </label>
                    </li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <button class="add-item-btn" id="add-item-btn">+ 새 항목 추가</button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <header class="top-header">
                <div class="hero-section">
                    <h1 class="gradient-text">AI 학습 가이드</h1>
                    <p class="subtitle">체계적으로 배우는 인공지능의 세계</p>
                </div>
                <div class="user-profile">
                    <div class="avatar">👤</div>
                    <span class="username">학습자님</span>
                </div>
            </header>

            <section class="content-cards">
                <div class="card glass-card fade-in" id="content-display">
                    <div class="card-header">
                        <h3 id="selected-title">항목을 선택해 주세요</h3>
                        <span class="badge" id="selected-status">진행 전</span>
                    </div>
                    <div class="card-body">
                        <p id="selected-description">왼쪽 체크리스트에서 학습할 주제를 선택하여 상세 내용을 확인하고 진행 상황을 기록하세요.</p>
                        <div class="placeholder-image" id="visual-content">
                            <!-- Placeholder for image generated by tool -->
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="primary-btn pulse" id="start-btn">학습 시작하기</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
